<!DOCTYPE html> 
<html lang="hi"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
  <title>Superhero Creator & Battle Pro</title> 
  <style> 
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      user-select: none;
      -webkit-user-select: none;
    } 
    body { 
      background: #0f0c20; 
      color: #fff; 
      text-align: center; 
      overflow: hidden; 
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    } 
    #creator-screen, #battle-screen { 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      width: 100%;
      height: 100vh; 
    } 
    .card { 
      background: rgba(30, 30, 45, 0.95); 
      padding: 25px; 
      border-radius: 16px; 
      width: 95%; 
      max-width: 400px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.6); 
      border: 1px solid #3a3a50;
    } 
    .card h2 { margin-bottom: 15px; color: #ff007f; font-size: 24px; text-shadow: 0 0 10px rgba(255,0,127,0.5); }
    label { display: block; text-align: left; margin-top: 12px; font-weight: bold; color: #b0b0d0; font-size: 14px;}
    input, select, button { 
      width: 100%; 
      padding: 14px; 
      margin: 8px 0; 
      border-radius: 10px; 
      border: none; 
      font-size: 16px; 
    } 
    input, select { 
      background: #252538; 
      color: #fff; 
      border: 1px solid #444460;
    } 
    input:focus, select:focus { outline: 2px solid #e63946; }
    button { 
      background: linear-gradient(45deg, #e63946, #ff007f); 
      color: white; 
      font-weight: bold; 
      cursor: pointer; 
      box-shadow: 0 4px 15px rgba(230,57,70,0.4);
      transition: transform 0.1s;
    } 
    button:active { transform: scale(0.98); }
    
    #battle-screen { display: none; position: relative; }
    .hud { 
      font-size: 18px; 
      margin-bottom: 10px; 
      font-weight: bold; 
      background: rgba(0,0,0,0.4);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #333;
      text-shadow: 1px 1px 2px #000;
    } 
    .canvas-container {
      width: 100%;
      max-width: 600px;
      position: relative;
    }
    canvas { 
      background: #141423; 
      border: 3px solid #ff007f; 
      border-radius: 12px; 
      width: 100%; 
      height: auto;
      aspect-ratio: 600 / 350;
      box-shadow: 0 0 20px rgba(255,0,127,0.3);
    } 
    .controls { 
      margin-top: 15px; 
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px; 
      width: 100%; 
      max-width: 600px; 
    } 
    .controls button { 
      margin: 0;
      padding: 15px 5px;
      font-size: 18px;
    } 
    .btn-blue { background: linear-gradient(45deg, #2a9d8f, #028090); box-shadow: 0 4px 15px rgba(2,128,144,0.4); }
    .btn-orange { background: linear-gradient(45deg, #f77f00, #fcbf49); box-shadow: 0 4px 15px rgba(247,127,0,0.4); }
    .btn-purple { background: linear-gradient(45deg, #a2d2ff, #bde0fe); color: #000; box-shadow: 0 4px 15px rgba(189,224,254,0.4); }
    
    #restart-btn {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      display: none;
      z-index: 10;
    }
  </style> 
</head> 
<body> 

  <!-- CREATOR SCREEN --> 
  <div id="creator-screen"> 
    <div class="card"> 
      <h2>Superhero Creator</h2> 
      <input type="text" id="hero-name" placeholder="Hero ka Naam" value="Blaze Hero"> 
      <label>Suit Color:</label> 
      <select id="suit-color"> 
        <option value="#e63946">Laal (Red)</option> 
        <option value="#1d3557">Neela (Blue)</option> 
        <option value="#2a9d8f">Hara (Green)</option> 
        <option value="#ffb703">Peela (Yellow)</option> 
      </select> 
      <label>Main Power:</label> 
      <select id="power-type"> 
        <option value="fire">Fire Blast 🔥</option> 
        <option value="web">Web Trap 🕸️</option> 
        <option value="both">Fire + Web Combo ⚡</option> 
      </select> 
      <button onclick="startGame()">Hero Banao Aur Ladne Jao!</button> 
    </div> 
  </div> 

  <!-- BATTLE SCREEN --> 
  <div id="battle-screen"> 
    <div class="hud" id="hud-text">Hero: 100 HP | Villain: 100 HP</div> 
    <div class="canvas-container">
      <canvas id="gameCanvas" width="600" height="350"></canvas> 
      <button id="restart-btn" onclick="resetGame()">Play Again 🔄</button>
    </div>
    <div class="controls"> 
      <button class="btn-blue" onmousedown="startMove('left')" onmouseup="stopMove()" ontouchstart="startMove('left')" ontouchend="stopMove()">⬅ Left</button> 
      <button class="btn-orange" onclick="attack('fire')">🔥 Fire</button> 
      <button class="btn-purple" onclick="attack('web')">🕸️ Web</button> 
      <button class="btn-blue" onmousedown="startMove('right')" onmouseup="stopMove()" ontouchstart="startMove('right')" ontouchend="stopMove()">Right ➡</button> 
    </div> 
  </div> 

  <script> 
    let hero = { x: 50, y: 260, hp: 100, name: '', color: '', power: '', moveDir: null }; 
    let villain = { x: 480, y: 260, hp: 100, color: '#8338ec', trapped: 0 }; 
    let projectiles = []; 
    let canvas, ctx, gameLoop, aiLoop; 
    let gameOver = false;

    function startGame() { 
      hero.name = document.getElementById('hero-name').value || 'Hero'; 
      hero.color = document.getElementById('suit-color').value; 
      hero.power = document.getElementById('power-type').value; 
      document.getElementById('creator-screen').style.display = 'none'; 
      document.getElementById('battle-screen').style.display = 'flex'; 
      canvas = document.getElementById('gameCanvas'); 
      ctx = canvas.getContext('2d'); 
      
      // Setup loops
      gameOver = false;
      document.getElementById('restart-btn').style.display = 'none';
      gameLoop = setInterval(updateGame, 30); 
      aiLoop = setInterval(villainAI, 1200); // Fast AI
    } 

    // Smooth movement for mobile/touch
    function startMove(dir) { hero.moveDir = dir; }
    function stopMove() { hero.moveDir = null; }

    // Keyboard Controls for PC
    window.addEventListener('keydown', (e) => {
      if(e.key === 'ArrowLeft' || e.key === 'a') hero.moveDir = 'left';
      if(e.key === 'ArrowRight' || e.key === 'd') hero.moveDir = 'right';
      if(e.key === 'f') attack('fire');
      if(e.key === 'w') attack('web');
    });
    window.addEventListener('keyup', () => { hero.moveDir = null; });

    function attack(type) { 
      if (gameOver) return;
      // Filter powers based on selection
      if (hero.power !== 'both' && hero.power !== type) {
        alert(`Aapne sirf ${hero.power.toUpperCase()} power chuni hai!`);
        return;
      }
      projectiles.push({ x: hero.x + 35, y: hero.y + 20, type: type, speed: 10 }); 
    } 

    function villainAI() { 
      if (gameOver) return; 
      if (villain.trapped > 0) { 
        villain.trapped--; 
        return; 
      } 
      // Intelligent shoot
      projectiles.push({ x: villain.x, y: villain.y + 20, type: 'enemy', speed: -8 }); 
    } 

    function resetGame() {
      hero.hp = 100; hero.x = 50; hero.moveDir = null;
      villain.hp = 100; villain.x = 480; villain.trapped = 0;
      projectiles = [];
      startGame();
    }

    function updateGame() { 
      ctx.clearRect(0, 0, canvas.width, canvas.height); 
      
      // Background details (Grid effect)
      ctx.strokeStyle = '#1f1f38';
      for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
      
      // Floor 
      ctx.fillStyle = '#22223b'; 
      ctx.fillRect(0, 310, canvas.width, 40); 
      ctx.fillStyle = '#ff007f';
      ctx.fillRect(0, 310, canvas.width, 4); // Neon line on floor
      
      // Handle continuous movement
      if (hero.moveDir === 'left' && hero.x > 20) hero.x -= 8; 
      if (hero.moveDir === 'right' && hero.x < villain.x - 50) hero.x += 8; 

      // Draw Hero (With eyes)
      ctx.fillStyle = hero.color; 
      ctx.fillRect(hero.x, hero.y, 35, 50); 
      ctx.fillStyle = '#fff'; // Eyes
      ctx.fillRect(hero.x + 22, hero.y + 10, 8, 5);
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(hero.name, hero.x - 5, hero.y - 10); 
      
      // Draw Villain 
      if (villain.hp > 0) { 
        ctx.fillStyle = villain.color; 
        ctx.fillRect(villain.x, villain.y, 40, 50); 
        ctx.fillStyle = '#fff'; // Enemy Eyes
        ctx.fillRect(villain.x + 10, villain.y + 10, 8, 5);
        ctx.fillStyle = '#ff4d6d'; 
        ctx.fillText('Villain Boss 😈', villain.x - 10, villain.y - 10); 
        
        if (villain.trapped > 0) { 
          ctx.strokeStyle = '#00f5d4';
          ctx.lineWidth = 3;
          ctx.strokeRect(villain.x - 5, villain.y - 5, 50, 60); 
          ctx.lineWidth = 1;
        } 
      } 
      
      // Move & Draw Projectiles 
      for (let i = projectiles.length - 1; i >= 0; i--) { 
        let p = projectiles[i]; 
        p.x += p.speed; 
        
        if (p.type === 'fire') { 
          ctx.fillStyle = '#ff5400'; 
          ctx.shadowColor = '#ff5400';
          ctx.shadowBlur = 10;
          ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0; // Reset blur
        } else if (p.type === 'web') { 
          ctx.fillStyle = '#00f5d4'; 
          ctx.fillRect(p.x, p.y, 16, 12); 
        } else if (p.type === 'enemy') { 
          ctx.fillStyle = '#ff0054'; 
          ctx.fillRect(p.x, p.y, 10, 10); 
        } 
        
        // Out of bounds check
        if(p.x > canvas.width || p.x < 0) { projectiles.splice(i, 1); continue; }

        // Check hits on Villain
